  <path d="M14 44C22 39 42 39 50 44" stroke="#A7F3D0" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round" />
  <ellipse cx="32" cy="50" rx="13" ry="4" fill="#022C22" fill-opacity="0.32" />
  <!-- Outer Map Pin Silhouette -->
  <path d="M32 11C22.611 11 15 18.611 15 28C15 39.25 32 52 32 52C32 52 49 39.25 49 28C49 18.611 41.389 11 32 11Z" fill="url(#pinGrad)" />
  <!-- Inner Exchange / Sharing Loop Circle -->
  <circle cx="32" cy="27.5" r="9.5" fill="#064E3B" />
  <!-- Two-Way Peer-to-Peer Sharing Arrows inside Pin -->
  <path d="M27.5 25.5H35.5L33.2 23.2" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M36.5 29.5H28.5L30.8 31.8" stroke="#FB923C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
